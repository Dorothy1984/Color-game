<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七彩水彩畫板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-overlay">
        <h1>點擊開啟水彩畫板</h1>
        <p>（開啟音訊以聆聽水滴聲）</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="toolbar">
        <button id="clear-btn">清空畫板</button>
    </div>

    <div class="controls">
        <button class="bubble" data-color="#ff4d4d" style="--c: #ff4d4d">紅</button>
        <button class="bubble" data-color="#ffa64d" style="--c: #ffa64d">橙</button>
        <button class="bubble" data-color="#ffff4d" style="--c: #ffff4d">黃</button>
        <button class="bubble" data-color="#4dff4d" style="--c: #4dff4d">綠</button>
        <button class="bubble" data-color="#4dffff" style="--c: #4dffff">藍</button>
        <button class="bubble" data-color="#4d4dff" style="--c: #4d4dff">靛</button>
        <button class="bubble" data-color="#b34dff" style="--c: #b34dff">紫</button>
    </div>

    <audio id="drip-audio" src="drip.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
