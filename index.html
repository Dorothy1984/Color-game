<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心靈彩繪 - 彩虹小溪療癒畫板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="start-overlay">
        <h1>點擊螢幕開啟療癒之旅</h1>
        <p>（需要開啟音訊）</p>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <button class="bubble" data-color="#ff4d4d" data-index="0">紅</button>
        <button class="bubble" data-color="#ffa64d" data-index="1">橙</button>
        <button class="bubble" data-color="#ffff4d" data-index="2">黃</button>
        <button class="bubble" data-color="#4dff4d" data-index="3">綠</button>
        <button class="bubble" data-color="#4dffff" data-index="4">藍</button>
        <button class="bubble" data-color="#4d4dff" data-index="5">靛</button>
        <button class="bubble" data-color="#b34dff" data-index="6">紫</button>
    </div>

    <audio id="stream-audio" src="stream.mp3" loop></audio>
    <audio id="drip-audio" src="drip.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
