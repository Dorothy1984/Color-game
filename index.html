<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>水彩畫板</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 畫布 -->
  <canvas id="canvas"></canvas>

  <!-- 工具列 -->
  <div class="toolbar">
    <button id="clear-btn" class="bubble" style="--c:#6c757d" title="清除">⟲</button>
    <button id="download-btn" class="bubble" style="--c:#198754" title="下載">⤓</button>
  </div>

  <!-- 控制列 -->
  <div class="controls">
    <label class="ctrl">
      顏色
      <input id="color" type="color" value="#3b82f6" />
    </label>
    <label class="ctrl">
      粗細
      <input id="size" type="range" min="1" max="60" step="1" value="16" />
    </label>
    <label class="ctrl">
      濕度
      <input id="alpha" type="range" min="0.05" max="1" step="0.05" value="0.35" />
    </label>
  </div>

  <!-- 起始遮罩（點一下開始作畫） -->
  <div id="start-overlay">
    <h1>點一下開始作畫</h1>
    <p>支援滑鼠、觸控與手寫筆</p>
  </div>

  <!-- 可選：水滴聲（示意） -->
  <audio id="drop-audio" preload="auto">
    <source src="data:audio/mp3;base64,//uQZAAAAAAAAAAAAAAAA..." type="audio/mpeg" />
  </audio>

  <script src="script.js" defer></script>
</body>
</html>
